<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos da festa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--main:#7b4aa6;--dark:#53306f;--line:#e9e2ed;--muted:#8b8290}
*{box-sizing:border-box}body{margin:0;background:#fbfafc;color:#443d48;font-family:Arial,sans-serif}
.wrap{width:min(100%,1050px);margin:auto;padding:28px 14px 60px}h1{font:400 clamp(32px,7vw,52px) Georgia,serif;color:var(--dark);margin:0}.sub{color:var(--muted)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--main);color:#fff;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat strong{display:block;font-size:28px;color:var(--dark)}.stat span{font-size:10px;color:var(--muted)}
.grid{columns:3 250px;column-gap:12px}.photo{break-inside:avoid;margin-bottom:12px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}.photo img{display:block;width:100%}.meta{padding:8px 10px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.dl{border:0;background:#f2ecf6;color:var(--dark);border-radius:999px;padding:6px 9px;font-weight:700;cursor:pointer}.progress{margin:10px 0;color:var(--dark);font-size:13px}.empty{padding:38px;text-align:center;color:var(--muted)}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<div class="top"><div><h1 id="title">Fotos da festa</h1><p class="sub">Acompanhe e guarde os registros compartilhados pelos convidados.</p></div><button class="btn" id="zipBtn">Baixar todas em ZIP</button></div>
<div class="stats"><div class="stat"><strong id="total">0</strong><span>FOTOS</span></div><div class="stat"><strong id="state">—</strong><span>ENVIOS</span></div></div>
<div id="progress" class="progress"></div><section id="grid" class="grid"></section>
</main>
<script>
const db=supabase.createClient('https://puevsrsipzzvkapqicex.supabase.co','sb_publishable_wu_JCjbkhrtquuNk7KkPfg_Z7ofeQJ_'),BUCKET='galeria-festas',token=new URLSearchParams(location.search).get('chave');let rows=[];
const url=p=>db.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
async function load(){if(!token){grid.innerHTML='<div class="empty">Link inválido.</div>';return}
 const {data,error}=await db.rpc('galeria_cliente',{p_token:token});if(error||!data?.length){grid.innerHTML='<div class="empty">Galeria não encontrada.</div>';return}
 title.textContent=data[0].evento_nome;state.textContent=data[0].uploads_abertos?'Abertos':'Encerrados';rows=data.filter(x=>x.foto_id);total.textContent=rows.length;render()}
function render(){grid.innerHTML=rows.length?rows.map(r=>`<article class="photo"><img loading="lazy" src="${url(r.storage_path)}"><div class="meta"><span>${r.enviado_por||'Convidado'}</span><button class="dl" data-url="${url(r.storage_path)}" data-id="${r.foto_id}">Baixar</button></div></article>`).join(''):'<div class="empty">Ainda não há fotos.</div>';document.querySelectorAll('.dl').forEach(b=>b.onclick=()=>one(b.dataset.url,'foto-'+b.dataset.id+'.jpg'))}
async function one(u,n){const r=await fetch(u),blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
zipBtn.onclick=async()=>{if(!rows.length)return;zipBtn.disabled=true;const z=new JSZip();let i=0;for(const row of rows){i++;progress.textContent=`Preparando ${i} de ${rows.length}...`;const r=await fetch(url(row.storage_path));z.file('foto-'+String(i).padStart(3,'0')+'.jpg',await r.blob())}progress.textContent='Gerando ZIP...';const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fotos-da-festa.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);progress.textContent='ZIP pronto.';zipBtn.disabled=false};
load();
</script></body></html>
