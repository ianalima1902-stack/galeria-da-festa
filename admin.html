<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel | Galeria colaborativa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f7f5f8;--dark:#51435a;--soft:#f0ebf3;--line:#e5dfe8;--muted:#8b8390;--danger:#a55d63;--good:#61825c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#443d48;font-family:Arial,sans-serif}
.wrap{width:min(100%,1120px);margin:auto;padding:24px 14px 60px}h1,h2,h3{font-family:Georgia,serif;color:var(--dark);font-weight:400}h1{font-size:clamp(34px,6vw,48px);margin:0}.sub{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(60,45,68,.06)}.login{max-width:520px;margin:8vh auto;padding:24px}
label{display:block;margin:12px 0 6px;font-size:10px;letter-spacing:1.4px;color:#777}input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 13px;font-size:15px}
.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--dark);color:#fff}.soft{background:var(--soft);color:var(--dark)}.ghost{background:#fff;border:1px solid var(--line);color:var(--dark)}.danger{background:#f8e9eb;color:var(--danger)}.good{background:#eaf3e7;color:var(--good)}.actions{display:flex;gap:8px;flex-wrap:wrap}.screen{display:none}.screen.active{display:block}
.top,.manager-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.new{padding:18px;margin-bottom:18px}.form{display:grid;grid-template-columns:1.4fr 1fr 1fr .6fr auto;gap:10px;align-items:end}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.event{padding:17px}.event h3{margin:0 0 4px;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.stat{background:#faf9fb;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat strong{display:block;color:var(--dark);font-size:22px}.stat span{font-size:9px;color:var(--muted);letter-spacing:1px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.link{padding:13px}code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:#777;margin:7px 0}#qrcode{background:#fff;padding:10px;width:max-content;border-radius:12px;margin-top:10px}
.gallery{columns:4 210px;column-gap:10px;margin-top:14px}.photo{break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}.photo img{display:block;width:100%}.foot{padding:8px;font-size:11px;color:var(--muted)}.progress{color:var(--dark);font-size:13px;margin:10px 0}
@media(max-width:780px){.form,.links,.grid{grid-template-columns:1fr}.top,.manager-head{flex-direction:column}}
</style></head><body><main class="wrap">
<section id="login" class="card login"><h2>Galeria colaborativa</h2><p class="sub">Painel administrativo</p><label>E-MAIL</label><input value="ianasousa1902@gmail.com" readonly><label>SENHA</label><input id="password" type="password"><div class="actions" style="margin-top:16px"><button class="btn primary" id="loginBtn">Entrar</button><button class="btn soft" id="signupBtn">Criar meu acesso</button></div></section>

<section id="events" class="screen"><div class="top"><div><h1>Minhas galerias</h1><p class="sub">Crie um evento, gere o QR Code e acompanhe as fotos.</p></div><button class="btn ghost" id="logoutBtn">Sair</button></div>
<section class="card new"><h3 style="margin-top:0">+ Nova galeria</h3><div class="form"><div><label>NOME DO EVENTO</label><input id="eName" placeholder="Ex.: Maria Eduarda | XV anos"></div><div><label>CLIENTE</label><input id="eClient"></div><div><label>LINK</label><input id="eSlug" placeholder="maria-eduarda-xv"></div><div><label>COR</label><input id="eColor" type="color" value="#8b6bb0"></div><button class="btn primary" id="createBtn">Criar</button></div></section>
<div id="eventGrid" class="grid"></div></section>

<section id="manager" class="screen"><button class="btn ghost" id="backBtn">← Galerias</button><div class="manager-head" style="margin-top:14px"><div><h1 id="mTitle"></h1><p id="mClient" class="sub"></p></div><div class="actions"><button class="btn good" id="toggleUploads"></button><button class="btn soft" id="zipAll">Baixar tudo ZIP</button><button class="btn danger" id="deleteEvent">Excluir evento</button></div></div>
<div class="links"><section class="card link"><b>Link público / QR Code</b><code id="publicLink"></code><div class="actions"><button class="btn soft" id="copyPublic">Copiar</button><button class="btn ghost" id="openPublic">Abrir</button></div><div id="qrcode"></div></section><section class="card link"><b>Link da cliente</b><code id="clientLink"></code><div class="actions"><button class="btn soft" id="copyClient">Copiar</button><button class="btn ghost" id="openClient">Abrir</button></div></section></div>
<div class="stats"><div class="stat"><strong id="photoCount">0</strong><span>FOTOS</span></div><div class="stat"><strong id="uploadState">—</strong><span>ENVIOS</span></div></div>
<div id="progress" class="progress"></div><section id="photosBox" class="gallery"></section></section>
</main>
<script>
const db=supabase.createClient('https://puevsrsipzzvkapqicex.supabase.co','sb_publishable_wu_JCjbkhrtquuNk7KkPfg_Z7ofeQJ_'),ADMIN='ianasousa1902@gmail.com',BUCKET='galeria-festas';let evs=[],pics=[],current=null;
const url=p=>db.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function slugify(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function show(el){events.classList.remove('active');manager.classList.remove('active');el.classList.add('active')}
eName.oninput=()=>{if(!eSlug.dataset.manual)eSlug.value=slugify(eName.value)};eSlug.oninput=()=>{eSlug.dataset.manual='1';eSlug.value=slugify(eSlug.value)};
signupBtn.onclick=async()=>{const p=password.value;if(p.length<6)return alert('Use pelo menos 6 caracteres.');const {error}=await db.auth.signUp({email:ADMIN,password:p});alert(error?error.message:'Acesso criado. Confira o e-mail se solicitado.')};
loginBtn.onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:ADMIN,password:password.value});if(error)return alert('E-mail ou senha inválidos.');if(data.user?.email!==ADMIN)return;login.style.display='none';show(events);load()};
logoutBtn.onclick=async()=>{await db.auth.signOut();location.reload()};
async function load(){const [e,p]=await Promise.all([db.from('galeria_eventos').select('*').order('criado_em',{ascending:false}),db.from('galeria_fotos').select('*').order('criado_em',{ascending:false})]);evs=e.data||[];pics=p.data||[];renderEvents();if(current){current=evs.find(x=>x.id===current.id);if(current)renderManager()}}
function renderEvents(){eventGrid.innerHTML=evs.map(e=>{const n=pics.filter(p=>p.evento_id===e.id).length;return `<article class="card event"><h3>${esc(e.nome)}</h3><div class="sub">${esc(e.cliente_nome||'')}</div><div class="stats"><div class="stat"><strong>${n}</strong><span>FOTOS</span></div><div class="stat"><strong>${e.uploads_abertos?'ABERTO':'FECHADO'}</strong><span>ENVIOS</span></div></div><button class="btn primary" onclick="manage(${e.id})">Gerenciar</button></article>`}).join('')}
createBtn.onclick=async()=>{const nome=eName.value.trim(),slug=slugify(eSlug.value||nome);if(!nome||!slug)return alert('Informe o evento.');const {data,error}=await db.from('galeria_eventos').insert({nome,cliente_nome:eClient.value.trim(),slug,cor_principal:eColor.value}).select().single();if(error)return alert('Não foi possível criar.');await load();manage(data.id)};
window.manage=id=>{current=evs.find(x=>x.id===id);show(manager);renderManager()};
backBtn.onclick=()=>{current=null;show(events)};
function renderManager(){mTitle.textContent=current.nome;mClient.textContent=current.cliente_nome||'';const base=location.origin,pub=`${base}/?evento=${current.slug}`,cli=`${base}/cliente.html?chave=${current.cliente_token}`;publicLink.textContent=pub;clientLink.textContent=cli;const ps=pics.filter(p=>p.evento_id===current.id);photoCount.textContent=ps.length;uploadState.textContent=current.uploads_abertos?'Abertos':'Encerrados';toggleUploads.textContent=current.uploads_abertos?'Encerrar envios':'Reabrir envios';qrcode.innerHTML='';new QRCode(qrcode,{text:pub,width:150,height:150});photosBox.innerHTML=ps.map(p=>`<article class="photo"><img loading="lazy" src="${url(p.storage_path)}"><div class="foot">${esc(p.enviado_por||'Convidado')}<div class="actions" style="margin-top:6px"><button class="btn danger" onclick="removePhoto(${p.id},'${p.storage_path}')">Excluir</button></div></div></article>`).join('')}
toggleUploads.onclick=async()=>{await db.from('galeria_eventos').update({uploads_abertos:!current.uploads_abertos}).eq('id',current.id);await load()};
window.removePhoto=async(id,path)=>{if(!confirm('Excluir esta foto?'))return;await db.storage.from(BUCKET).remove([path]);await db.from('galeria_fotos').delete().eq('id',id);await load()};
copyPublic.onclick=()=>navigator.clipboard.writeText(publicLink.textContent);copyClient.onclick=()=>navigator.clipboard.writeText(clientLink.textContent);openPublic.onclick=()=>window.open(publicLink.textContent,'_blank');openClient.onclick=()=>window.open(clientLink.textContent,'_blank');
zipAll.onclick=async()=>{const ps=pics.filter(p=>p.evento_id===current.id);if(!ps.length)return;zipAll.disabled=true;const z=new JSZip();let i=0;for(const p of ps){i++;progress.textContent=`Baixando ${i} de ${ps.length}...`;const r=await fetch(url(p.storage_path));z.file('foto-'+String(i).padStart(3,'0')+'.jpg',await r.blob())}progress.textContent='Gerando ZIP...';const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current.slug+'-fotos.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);progress.textContent='ZIP pronto.';zipAll.disabled=false};
deleteEvent.onclick=async()=>{if(!confirm('Isso apagará TODAS as fotos deste evento. Exporte e confira o backup antes. Continuar?'))return;const ps=pics.filter(p=>p.evento_id===current.id);for(let i=0;i<ps.length;i+=100)await db.storage.from(BUCKET).remove(ps.slice(i,i+100).map(x=>x.storage_path));await db.from('galeria_eventos').delete().eq('id',current.id);current=null;show(events);await load()};
db.channel('admin-gallery').on('postgres_changes',{event:'*',schema:'public',table:'galeria_fotos'},()=>load()).subscribe();
(async()=>{const {data:{session}}=await db.auth.getSession();if(session?.user?.email===ADMIN){login.style.display='none';show(events);load()}})();
</script></body></html>
